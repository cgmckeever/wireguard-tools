# The same checks as the pre-commit hook: ./test.sh all (ruff, mypy, pytest;
# the ruff pin is in test.sh, also pyproject.toml). On the oldest Python a
# server may have, and a current one. test.sh makes its own .venv from the
# python3 setup-python puts first on PATH.
name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.8"}    # the oldest Python a server may have
          - {os: ubuntu-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: ./test.sh all
