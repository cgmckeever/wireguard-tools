name: tests
on: [push, pull_request]
jobs:
  pytest:
    strategy:
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.8"}    # the oldest Python a server may have
          - {os: ubuntu-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest -q tests
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.4 mypy
      - run: ruff check wgt tests
      - run: mypy                                # settings in pyproject.toml
