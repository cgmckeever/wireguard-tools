PostUp = ip route replace 10.8.0.0/24 dev wg1 table 101
PostUp = ip route replace default dev cf table 101 2>/dev/null || true
PostUp = ip route replace blackhole default metric 4096 table 101
PostUp = while ip rule del from 10.8.0.0/24 lookup 101 priority 10000 2>/dev/null; do :; done; ip rule add from 10.8.0.0/24 lookup 101 priority 10000
PostUp = iptables -t nat -C POSTROUTING -s 10.8.0.0/24 -o cf -j MASQUERADE 2>/dev/null || iptables -t nat -I POSTROUTING -s 10.8.0.0/24 -o cf -j MASQUERADE
